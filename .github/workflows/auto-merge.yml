name: Auto-Merge High Confidence PRs

on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge if high confidence
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.user.login == 'RainTreeQ' || github.event.pull_request.user.login == 'RainTreeQ' &&
      contains(github.event.pull_request.labels.*.name, 'high-confidence')

    steps:
      - name: Verify only selectors.json changed
        id: check_files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const safeFiles = files.every((f) => f.filename === 'selectors.json');
            core.setOutput('safe', safeFiles ? 'true' : 'false');
            if (!safeFiles) {
              console.log('Unsafe: PR modifies files other than selectors.json');
              console.log('Changed files:', files.map((f) => f.filename).join(', '));
            }

      - name: Merge PR
        if: steps.check_files.outputs.safe == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SELECTORS_REPO_PAT }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: context.payload.pull_request.title,
              commit_message: 'Auto-merged by GitHub Actions (high confidence)',
            });

      - name: Comment on merge
        if: steps.check_files.outputs.safe == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Auto-merged. Users will receive the update within 12 hours.',
            });

      - name: Reject unsafe PR
        if: steps.check_files.outputs.safe != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Auto-merge blocked: PR modifies files other than selectors.json. Manual review required.',
            });
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'high-confidence',
            });
